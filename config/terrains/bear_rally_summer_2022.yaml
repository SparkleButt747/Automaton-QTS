  scenario_description: "Classic bear market rally — SPY bounced from June 17 low (362) to August 16 high (431), a 19% recovery that lured many back in before the next leg down. The rally was driven by: peak inflation narrative (CPI MoM decelerated in July), strong Q2 earnings beats, short covering, and retail FOMO. Fed speakers remained hawkish throughout but markets priced in a 2023 pivot. Jackson Hole on August 26 ended the party — Powell delivered a 9-minute speech signalling continued aggressive hikes, SPY fell 3.4% that day and never recovered the summer highs until 2023."

