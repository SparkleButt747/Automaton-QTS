services:
  # ---- TimescaleDB (PostgreSQL + time-series extension) ----
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: qts-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: qts
      POSTGRES_PASSWORD: qts_dev_password
      POSTGRES_DB: trading
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qts -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis (Celery broker + result backend + cache) ----
  redis:
    image: redis:7-alpine
    container_name: qts-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- QTS Application ----
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: qts-app
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://qts:qts_dev_password@timescaledb:5432/trading
      REDIS_URL: redis://redis:6379/0
      QTS_ENV: development
      QTS_LOG_LEVEL: INFO
      QTS_METRICS_PORT: "8080"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../config:/app/config:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "from qts.config import get_settings; s = get_settings(); print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---- Celery Worker ----
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: qts-celery-worker
    restart: unless-stopped
    depends_on:
      - redis
      - timescaledb
    environment:
      DATABASE_URL: postgresql+asyncpg://qts:qts_dev_password@timescaledb:5432/trading
      REDIS_URL: redis://redis:6379/0
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../config:/app/config:ro
    command: celery -A qts.tasks worker --loglevel=info --concurrency=2

  # ---- Prometheus ----
  prometheus:
    image: prom/prometheus:latest
    container_name: qts-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app

  # ---- Grafana ----
  grafana:
    image: grafana/grafana:latest
    container_name: qts-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  timescaledb_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
  grafana_data:
