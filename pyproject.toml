[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qts"
version = "0.1.0"
description = "Quantitative Trading System - Multi-signal crypto/equity strategy engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QTS Team" }]

dependencies = [
  # Core
  "pydantic>=2.0",
  "pydantic-settings",
  "sqlalchemy>=2.0",
  "alembic",
  "httpx",
  "websockets",
  "python-dotenv",
  "numpy",
  "pandas",
  "pyarrow",
  "rich",
  "click",
  # Monitoring
  "prometheus-client",
  # Sentiment
  "transformers",
  "torch",
  "vaderSentiment",
  "praw",
  "nltk",
  # Signals
  "hmmlearn",
  "scikit-learn",
  # LLM
  "anthropic",
  # Task queue
  "celery",
  "redis",
  # Async PostgreSQL driver
  "asyncpg",
]

[project.optional-dependencies]
trading = [
  "nautilus_trader",
]
hft = [
  "hftbacktest",
]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "hypothesis",
  "mypy",
  "ruff",
  "black",
  "responses",
  "pre-commit",
  "aiosqlite",
]

[project.scripts]
qts = "qts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qts"]

[tool.mypy]
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "vaderSentiment.*",
  "hmmlearn.*",
  "nltk.*",
  "praw.*",
  "celery.*",
  "redis.*",
  "torch.*",
  "transformers.*",
  "sklearn.*",
  "nautilus_trader.*",
  "hftbacktest.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "ANN", # flake8-annotations
  "S",   # flake8-bandit
]
ignore = [
  "ANN101",  # missing-type-self
  "ANN102",  # missing-type-cls
  "S101",    # assert (needed for tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN"]
"scripts/**/*.py" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --cov=src/qts --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.mypy_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.coverage.run]
source = ["src/qts"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
